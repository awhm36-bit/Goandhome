<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Work Hours</title>
<meta name="theme-color" content="#3b5bfd">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#f3f4f7;--card:#ffffff;--text:#15171c;--sub:#666d7a;--line:#e5e7ed;--muted:#eceef3;
  --pri:#3b5bfd;--pri-soft:#e7ecff;--on-pri:#ffffff;--half:#b45309;--half-soft:#fff0d3;
  --go1:#34d399;--go2:#059669;--stop1:#fb7185;--stop2:#e11d48;--danger:#d61f45;--memo:#16a34a;
  --ov:rgba(10,12,18,.45);--toast-bg:#15171c;--toast-fg:#ffffff;
  --shadow:0 4px 20px rgba(20,28,60,.06);--shadow-s:0 1px 4px rgba(20,28,60,.12);
  --font:Roboto,"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
html[data-lang="ko"]{--font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--card:#181b21;--text:#f2f3f5;--sub:#9aa1ad;--line:#272b33;--muted:#22262e;
    --pri:#6b84ff;--pri-soft:#232b4d;--half:#fbbf24;--half-soft:#3a2f17;--danger:#fb7185;--memo:#22c55e;
    --ov:rgba(0,0,0,.6);--toast-bg:#f2f3f5;--toast-fg:#15171c;--shadow:none;--shadow-s:none;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);touch-action:manipulation;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));letter-spacing:-.2px}
html:not([data-lang="ko"]) body{letter-spacing:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-block:calc(8px + env(safe-area-inset-top,0px)) 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:none;animation:fade .25s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.top{padding:14px 4px 10px}
.top.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hl{min-width:0}
.eyebrow{margin:0 0 4px;font-size:13px;color:var(--sub);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.6px;text-wrap:balance}
h1.long{font-size:21px}
h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.4px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.lbl{font-size:13px;font-weight:700;color:var(--sub);margin:18px 4px 8px}
.lbl em{font-style:normal;color:var(--pri)}
.hint{font-size:12.5px;color:var(--sub);line-height:1.55;margin:10px 4px 0}
.empty{color:var(--sub);text-align:center;padding:18px 0;margin:0;font-size:14px}

/* 업종 */
.jobpill{flex:none;max-width:48%;display:flex;align-items:center;gap:4px;border:0;background:var(--card);box-shadow:var(--shadow);
  border-radius:999px;padding:9px 12px 9px 14px;font-size:14px;font-weight:700;margin-bottom:2px}
.jobpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobpill i{font-style:normal;color:var(--sub);font-size:12px}
.others{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 14px}
.others:empty{display:none}
.other{border:0;background:var(--muted);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.other .lv{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none}
.joblist{display:flex;flex-direction:column;margin-bottom:6px}
.jobrow{display:flex;align-items:center;gap:8px;width:100%;border-top:1px solid var(--line)}
.jobrow:first-child{border-top:0}
.jsel{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:14px 4px;font-size:16px;font-weight:600;text-align:left}
.jobrow .jn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobrow .ck{color:var(--pri);font-weight:800}
.jobrow.on .jn{color:var(--pri)}

/* 홈 */
.btnwrap{display:flex;justify-content:center;margin:22px 0 18px}
.punch{width:216px;height:216px;max-width:100%;border-radius:50%;border:0;color:#ffffff;position:relative;padding:0 18px;
  background:linear-gradient(150deg,var(--go1),var(--go2));
  box-shadow:0 20px 40px -14px rgba(5,150,105,.6),inset 0 2px 0 rgba(255,255,255,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s}
.punch:active{transform:scale(.95)}
.punch .pl{font-size:46px;font-weight:900;letter-spacing:-1px;line-height:1.15;text-align:center}
.punch .ps{font-size:14px;opacity:.9;font-weight:600;text-align:center}
.punch.on{background:linear-gradient(150deg,var(--stop1),var(--stop2));box-shadow:0 20px 40px -14px rgba(225,29,72,.6),inset 0 2px 0 rgba(255,255,255,.25)}
.punch.on::before,.punch.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(225,29,72,.35);animation:pulse 2.2s infinite}
.punch.on::after{animation-delay:1.1s}
@keyframes pulse{from{transform:scale(.96);opacity:1}to{transform:scale(1.18);opacity:0}}
.timer{text-align:center;font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.timer.dim{color:var(--sub);font-size:34px}
.since{text-align:center;color:var(--sub);font-size:14px;margin:4px 0 8px}
.cancel{display:block;margin:0 auto 14px;background:none;border:0;color:var(--sub);font-size:13px;text-decoration:underline;padding:6px;text-align:center}
.todayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.todayhead span{font-size:14px;color:var(--sub);font-weight:600}
.big{font-size:28px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 배지 */
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:0;white-space:nowrap}
.badge.full,.badge.work{background:var(--pri);color:var(--on-pri)}
.badge.half{background:var(--half-soft);color:var(--half)}
.badge.none{background:var(--muted);color:var(--sub)}
.badge.rest{background:transparent;color:var(--sub);box-shadow:inset 0 0 0 1.5px var(--line)}
.badge.live{background:var(--muted);color:var(--danger)}

/* 기록 줄 */
.rec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec b{font-size:16px;font-variant-numeric:tabular-nums}
.rec small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.acts{display:flex;gap:6px;flex:none}
.acts button{border:0;background:var(--muted);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.acts .del{color:var(--danger)}

/* 달력 */
.icon{width:42px;height:42px;flex:none;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:22px;font-weight:700;display:grid;place-items:center}
.ctitle{text-align:center;min-width:0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum.four{grid-template-columns:repeat(4,1fr)}
.sum div{background:var(--card);border-radius:16px;padding:12px 10px;box-shadow:var(--shadow);min-width:0}
.sum span{display:block;font-size:12px;color:var(--sub);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.sum b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.sum.four b{font-size:16px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk{margin-bottom:6px}
.wk span{text-align:center;font-size:12px;color:var(--sub);font-weight:700;overflow:hidden;white-space:nowrap}
.wk span.sun{color:var(--danger)}.wk span.sat{color:var(--pri)}
.d{aspect-ratio:1/1.18;max-width:100%;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:7px 0 0;gap:3px;position:relative;min-width:0;overflow:hidden}
.d b{font-size:14px;font-weight:600}
.d small{font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.d.sun b{color:var(--danger)}.d.sat b{color:var(--pri)}
.d.full,.d.work{background:var(--pri);color:var(--on-pri)}.d.full b,.d.work b{color:var(--on-pri)}
.d.half{background:var(--half-soft);color:var(--half)}
.d.none{background:var(--muted);color:var(--sub)}
.d.rest{box-shadow:inset 0 0 0 1px var(--line)}
.d.rest small{color:var(--sub)}
.d.today{box-shadow:inset 0 0 0 2px var(--text)}
.d .dot{width:6px;height:6px;border-radius:50%;background:var(--danger);margin-top:2px;animation:blink 1.4s infinite}
.d .mdot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--memo);box-shadow:0 0 0 1.5px var(--card)}
@keyframes blink{50%{opacity:.25}}
.legend{display:flex;gap:6px 14px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.lg-memo{width:8px;height:8px;border-radius:50%;background:var(--memo)}

/* 시트 */
.ov{position:fixed;inset:0;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.ov.show{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:480px;background:var(--card);border-radius:26px 26px 0 0;
  padding-top:10px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  max-height:90vh;overflow:auto;transform:translateY(40px);transition:transform .25s ease}
.ov.show .panel{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.x{width:36px;height:36px;flex:none;border-radius:12px;border:0;background:var(--muted);font-size:16px}
.io{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--muted);border-radius:18px;padding:16px}
.io div span{display:block;font-size:12px;color:var(--sub);font-weight:600}
.io div b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.io small.ap{display:inline;font-size:13px;font-weight:700;color:var(--sub);margin:0 3px}
.io em{font-style:normal;font-size:11px;color:var(--sub);margin-left:3px}
.io .arrow{color:var(--sub);font-size:18px}
.io .badge{margin-left:auto;font-size:14px;padding:6px 12px}
.tot{margin:10px 4px 4px;font-weight:700}
.msg{color:var(--sub);white-space:pre-line;line-height:1.6;margin:0 0 18px}
.memo{width:100%;min-height:84px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:12px;font-size:15px;line-height:1.5;resize:vertical;outline:none;color:var(--text)}
.memo:focus{border-color:var(--memo)}
.picklist{display:flex;flex-direction:column}
.pick{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-top:1px solid var(--line);padding:13px 4px;text-align:left}
.pick:first-child{border-top:0}
.pick span{flex:1;min-width:0}
.pick b{display:block;font-size:16px;font-weight:600}
.pick small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.pick i{font-style:normal;color:var(--pri);font-weight:800}
.pick.on b{color:var(--pri)}

/* 입력 */
.field{display:block;margin-bottom:12px;min-width:0}
.field>span{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
.field input,.money{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;outline:none;min-width:0}
.field input:focus,.money:focus-within{border-color:var(--pri)}
.money{display:flex;align-items:center;gap:6px}
.money i{font-style:normal;font-weight:800;color:var(--sub);white-space:nowrap}
.money input{border:0;background:none;height:100%;padding:0;flex:1;width:100%;min-width:0;outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;min-height:54px;border-radius:16px;border:0;font-size:16px;font-weight:700;margin-top:8px;padding:8px 12px}
.btn.pri{background:var(--pri);color:var(--on-pri)}
.btn.red{background:var(--danger);color:#ffffff}
.btn.ghost{background:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btns.one{grid-template-columns:1fr}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.chips button{flex:none;border:0;background:var(--muted);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:700;white-space:nowrap}
.chips button:active{background:var(--pri-soft);color:var(--pri)}
.chips button.on{background:var(--pri);color:var(--on-pri)}
.bk{width:100%;height:150px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;resize:none;outline:none}

/* 웨이지 결과 */
.res-top span{font-size:13px;color:var(--sub);font-weight:600}
.amount{font-size:40px;font-weight:900;letter-spacing:-1px;margin:4px 0 2px;color:var(--pri);word-break:break-all;font-variant-numeric:tabular-nums}
.period{font-size:13px;color:var(--sub);margin-bottom:12px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
button.line{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;border-radius:0}
button.line:active{background:var(--muted)}
.line .l{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.line .r{display:flex;align-items:center;gap:6px;flex:none}
.line small{color:var(--sub);font-size:12.5px}
.line b{font-variant-numeric:tabular-nums}
.chev{color:var(--sub);font-size:20px;line-height:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stats div{background:var(--muted);border-radius:14px;padding:12px;min-width:0}
.stats span{display:block;font-size:12px;color:var(--sub);font-weight:600}
.stats b{font-size:18px;font-weight:800}
.gh{display:flex;align-items:center;gap:8px}
.gh .badge{font-size:14px;padding:5px 11px}
.sumlist{display:flex;flex-direction:column}
.sumrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;text-align:left;font-size:14px}
.sumrow:first-child{border-top:0}
.sumrow .st{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.sumrow b{min-width:74px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sumrow small.bill{display:block;font-size:12px;color:var(--pri);font-weight:600;margin-top:1px}
.sumtot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;padding:14px 16px;background:var(--muted);border-radius:14px}
.sumtot span{color:var(--sub);font-weight:600}
.sumtot b{font-size:18px;font-weight:800;text-align:right}
.sumtot small{font-size:13px;color:var(--sub);font-weight:600}
.certwrap{background:var(--muted);border-radius:14px;padding:10px;margin-bottom:4px}
.certwrap img{width:100%;display:block;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#ffffff}

/* 설정 */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.setrow>div:first-child{min-width:0}
.setrow.col{flex-direction:column;align-items:stretch}
.setrow+.setrow,.pickrow+.setrow{border-top:1px solid var(--line)}
.setrow b{font-size:16px}
.setrow small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.setrow .chips{margin:4px 0 0}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 0;text-align:left}
.pickrow div{flex:1;min-width:0}
.pickrow b{display:block;font-size:16px}
.pickrow small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:36px;height:36px;border-radius:12px;border:0;background:var(--muted);font-size:20px;font-weight:700}
.stepper input{width:48px;height:36px;text-align:center;border:0;background:none;font-size:18px;font-weight:800}
.stepper span{font-size:13px;color:var(--sub);margin-right:2px}
.row-btn{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 0;font-size:15.5px;font-weight:600;border-top:1px solid var(--line)}
.row-btn:first-child{border-top:0}
.row-btn.danger{color:var(--danger)}
.mini{flex:none;border:0;background:var(--muted);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:700}
.sw{width:50px;height:30px;flex:none;border-radius:999px;border:0;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#ffffff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--pri)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--muted);border-radius:12px;padding:4px;gap:4px;margin-top:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px 6px;font-size:14px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow-s)}

/* 하단 탭 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 90%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.nav .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:480px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);font-size:11px;font-weight:700;padding:4px 0;min-width:0}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--text)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--toast-bg);color:var(--toast-fg);
  padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;max-width:88vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- 홈 -->
  <section id="s-home" class="screen on">
    <header class="top hrow">
      <div class="hl"><p class="eyebrow" id="h-date"></p><h1 id="h-title"></h1></div>

  const ta = $('#bk-out'); ta.value = json;
  $('#bk-copy').onclick = () => {
    const fallback = () => { ta.focus(); ta.select(); toast(T('tSelect')); };
    try {
      if (!navigator.clipboard) return fallback();
      navigator.clipboard.writeText(json).then(() => toast(T('tCopied')), fallback);
    } catch (e) { fallback(); }
  };
  $('#bk-save').onclick = () => fileBackup(false);
};
function applyImport(text) {
  let d = null;
  try { d = migrate(JSON.parse(text)); } catch (e) {}
  if (!d) return toast(T('tBadBackup'));
  const n = d.jobs.reduce((a, j) => a + j.sessions.length, 0);
  confirmBox(esc(T('impQ')), esc(T('impMsg2', { jobs: T('nJobs', { n: d.jobs.length }), recs: T('nRecs', { n }) })), T('impOk'), () => {
    db = d; save(); setupLang(); applyStatic(); render(); toast(T('tImported'));
  });
}
$('#imp').onclick = () => {
  openSheet(`<div class="sh-head"><h2>${esc(T('imp'))}</h2>${xBtn()}</div>
    <p class="msg">${esc(T('impMsg'))}</p>
    <button class="btn pri" id="bk-file" style="margin-top:0">${esc(T('pickFile'))}</button>
    <textarea class="bk" id="bk-in" placeholder="${esc(T('pastePh'))}" style="margin-top:14px"></textarea>
    <button class="btn ghost" id="bk-go">${esc(T('pasteGo'))}</button>`);
  $('#bk-go').onclick = () => applyImport($('#bk-in').value.trim());
  $('#bk-file').onclick = () => $('#impf').click();
};
$('#impf').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => { applyImport(String(r.result)); e.target.value = ''; };
  r.readAsText(file);
};
$('#wipe').onclick = () => {
  const j = J();
  confirmBox(esc(T('wipeQ', { name: j.name })), esc(T('wipeMsg')), T('wipeOk'), () => {
    j.sessions = []; j.current = null; j.memos = {}; save(); render(); toast(T('tWiped'));
  }, true);
};

/* ---------- 앱 설치 · 오프라인 ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#install').hidden = false; });
$('#install').onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice;
  installEvt = null; $('#install').hidden = true;
};
window.addEventListener('appinstalled', () => toast(T('tInstalled')));
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !$('#ov').classList.contains('show')) { db = load(); setupLang(); applyStatic(); render(); }
});
applyStatic();
render();
</script>
</body>
</html>
